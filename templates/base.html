<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Otodom Tracker{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="{% url 'listings:property_list' %}" class="text-xl font-bold tracking-wide flex items-center gap-2">
                <span class="text-indigo-400">🏡</span> Otodom Tracker
            </a>
            <nav class="flex items-center gap-4">
                <a href="{% url 'admin:index' %}" class="text-sm font-medium text-gray-300 hover:text-white transition">Panel Admina</a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500">
            Otodom Price Tracker &copy; {% now "Y" %}
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
