{% extends 'base.html' %}

{% block title %}Logowanie - Otodom Tracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-sm border border-gray-200 mt-10">
    <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Zaloguj się</h1>
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
            <p class="text-red-500 text-sm mb-4">Niepoprawny login lub hasło.</p>
        {% endif %}
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nazwa użytkownika</label>
            <input type="text" name="username" required class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">Hasło</label>
            <input type="password" name="password" required class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition text-sm">
            Zaloguj
        </button>
        <div class="mt-4 text-center text-xs text-gray-500">
            Nie masz jeszcze konta? <a href="{% url 'register' %}" class="text-indigo-600 hover:underline">Zarejestruj się</a>
        </div>        
    </form>
</div>
{% endblock %}
